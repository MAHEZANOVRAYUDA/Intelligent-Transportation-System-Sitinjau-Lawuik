# Konfigurasi Sistem Monitoring Jalan Sitinjau Laut
# Dinas Perhubungan Provinsi Sumatera Barat

project:
  name: "Sitinjau Laut Traffic Monitoring"
  version: "0.1.0"

# Spesifikasi jalan A → B
road:
  length_km: 16.5
  two_lane_percent: 65      # 65% jalan muat 2 kendaraan sejajar
  six_lane_percent: 35      # 35% jalan muat 6 kendaraan sejajar
  total_capacity_meter_lajur: 56100

# Panjang kendaraan + gap (meter)
vehicles:
  mobil:
    length_m: 6.0
    coco_classes: ["car"]
  motor:
    length_m: 2.5
    coco_classes: ["motorcycle", "bicycle"]
  bus:
    length_m: 14.0
    coco_classes: ["bus"]
  truck:
    length_m: 12.0
    coco_classes: ["truck"]

# Threshold status lalu lintas (% kapasitas terpakai)
traffic_status:
  lancar_max: 50
  padat_max: 75
  # di atas padat_max = macet

# Standar Pedoman Kapasitas Jalan Indonesia (PKJI 2023 - SE Ditjen Bina Marga No. 21/SE/Db/2023)
# Tipe Ruas: Jalan Luar Kota / Antarkota 2/2 TT Medan Pegunungan Ekstrem (Sitinjau Lauik)
pkji:
  base_capacity_c0: 3550.0          # Kapasitas dasar C0 (smp/jam) dua arah
  road_width_m: 6.5               # Lebar jalur efektif (meter)
  factor_fc_w: 0.91               # Faktor penyesuaian lebar jalur (FCw)
  factor_fc_sp: 1.0              # Faktor pemisahan arah (FCsp, 50-50 = 1.00)
  factor_fc_sf: 0.91             # Faktor hambatan samping & bahu jalan (FCsf)
  segment_mode: "khusus"
  citation: "SE Ditjen Bina Marga No. 21/SE/Db/2023"
  calculation_mode: "composite"   # "composite" (pembobotan sub-kelas PKJI 2023) | "direct"
  ekr:                            # Ekivalen Kendaraan Ringan (ekr / emp)
    mobil: 1.0                   # Kendaraan Ringan (KR / LV) - basis referensi
    motor: 0.4                   # Sepeda Motor (SM / MC)
    bus: 2.5                     # Bus Sedang / Besar (BS) tanjakan terjal
    truck: 8.9                   # Truk Barang (TB / HV) tanjakan ekstrem Sitinjau Lauik (>8%)
  subclasses:
    uphill:
      ks: 1.50                    # Kendaraan Sedang (bus kecil, truk 2-as kecil)
      bb: 2.50                    # Bus Besar (roda 6+)
      tb: 8.90                    # Truk Besar (tronton/kontainer/3-as)
    downhill:
      ks: 1.20
      bb: 1.60
      tb: 2.50
  composition_ratios:
    p_bus_ks: 0.0                 # Proporsi bus mikro/kecil (default 0.0 untuk baseline konservatif)
    p_bus_bb: 1.0                 # Proporsi bus besar
    p_truck_ks: 0.0               # Proporsi truk sedang/engkel (default 0.0 untuk baseline konservatif)
    p_truck_tb: 1.0               # Proporsi truk besar/tronton
  los_thresholds:
    los_a_max: 0.20
    los_b_max: 0.44
    los_c_max: 0.74
    los_d_max: 0.84
    los_e_max: 1.00
    lancar_max_ds: 0.44           # Batas LoS B
    padat_max_ds: 0.84            # Batas LoS D (di atas 0.84 = Macet / LoS E-F)

# Gerbang
gates:
  A:
    name: "Gerbang A — Jl. Padang Besi (Kota Padang)"
    location: "Jl. Padang Besi (Kota Padang)"
    direction: "A_to_B"
    # Garis virtual counting [x1, y1, x2, y2] — kalibrasi setelah kamera terpasang
    # Default untuk resolusi ~2304x1296 (kamera Bardi prototype)
    counting_line: [0, 854, 2303, 854]
    entry_direction: down
    # Garis pemisah lajur (cyan) — kalibrasi dari /dev
    lane_divider: [1091, 16, 1153, 1274]
    inbound_side: left
  B:
    name: "Gerbang B — Jembatan Timbang (Solok)"
    location: "Jembatan Timbang (Solok)"
    direction: "B_to_A"
    # Default untuk resolusi kamera Bardi (2560x1440 / 2304x1296) full-span
    counting_line: [0, 816, 2559, 854]
    entry_direction: down
    lane_divider: [1150, 0, 1150, 1439]
    inbound_side: left

# Model deteksi
detection:
  model_path: "models/yolov8n.pt"
  confidence: 0.15
  iou: 0.5
  imgsz: 960
  device: "cpu"  # cpu | cuda | coral (saat deploy)
  classes: ["motor", "mobil", "bus", "truck"]

# Tracking & counting (tuning akurasi)
# Asosiasi: mahalanobis | linear | quadratic
# quadratic = D**_ij = D_ij + λ(1 - IoU)^2  (dokumen penelitian, arahan dosen)
# min_count_confidence harus ≤ detection.confidence agar bbox yang tampil ikut dihitung.
tracking:
  max_distance: 280
  max_disappeared: 30
  min_hits: 2
  min_track_age: 1
  min_count_confidence: 0.05
  association: quadratic
  lambda_consistency: 5.0
  mahalanobis_gate: 9.4877
  iou_match_min: 0.25
  detect_every_n: 2          # YOLO tiap N frame; frame skip menahan kotak terakhir (mencegah kedip & drift)
  strict_lane_filter: false  # true = IN/OUT harus sesuai sisi garis cyan

# Stream video
stream:
  # Resolusi output live cam web (lebih kecil = lebih lancar)
  output_width: 1280
  output_height: 720
  fps: 15
  # Buffer minimal untuk kurangi latency
  buffer_size: 1
  # JPEG quality untuk MJPEG stream (1-100)
  jpeg_quality: 80
  reconnect_delay_sec: 5
  max_reconnect_attempts: 0  # 0 = unlimited

# Estimasi waktu tempuh untuk mode single-gate (detik)
# 16.5 km @ 40 km/jam ≈ 1500 detik (~25 menit)
# Dilengkapi fungsi tundaan adaptif BPR (Bureau of Public Roads) untuk kemacetan ekstrem
transit:
  avg_speed_kmh: 40
  estimated_transit_sec: 1500
  adaptive_enabled: true
  bpr_alpha: 2.5
  bpr_beta: 2.0
  max_transit_sec: 9000

# Database
database:
  url: "sqlite:///./data/sitinjau_laut.db"
  retention_days: 90

# API
api:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]
